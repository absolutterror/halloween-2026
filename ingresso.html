<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ingresso — Halloween 2026</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            background:
                radial-gradient(circle at top, #321000 0%, #0b0b0b 45%, #000 100%);

            color: white;

            font-family: Arial, Helvetica, sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px;

        }

        .ticket {

            width: 100%;

            max-width: 430px;

            background: #111;

            border: 1px solid #333;

            border-radius: 18px;

            padding: 30px 25px;

            text-align: center;

            box-shadow:
                0 0 30px rgba(255, 69, 0, 0.18);

        }

        .icon {

            font-size: 55px;

            margin-bottom: 10px;

        }

        h1 {

            color: #ff5a00;

            font-size: 30px;

            letter-spacing: 2px;

            margin-bottom: 5px;

        }

        .subtitle {

            color: #aaa;

            font-size: 14px;

            margin-bottom: 25px;

        }

        .info {

            background: #181818;

            border-left: 4px solid #ff5a00;

            border-radius: 10px;

            padding: 18px;

            text-align: left;

            margin-bottom: 25px;

        }

        .info p {

            margin-bottom: 12px;

            color: #ddd;

        }

        .info p:last-child {

            margin-bottom: 0;

        }

        .label {

            color: #ff5a00;

            font-weight: bold;

        }

        .qr-area {

            background: white;

            border-radius: 14px;

            padding: 18px;

            display: inline-block;

            margin-bottom: 20px;

        }

        #qrcode img {

            display: block;

        }

        .qr-text {

            color: #aaa;

            font-size: 13px;

            line-height: 1.5;

            margin-bottom: 15px;

        }

        .id {

            display: inline-block;

            background: #080808;

            border: 1px solid #333;

            border-radius: 8px;

            padding: 10px 14px;

            color: #ff5a00;

            font-weight: bold;

            font-size: 14px;

            word-break: break-all;

        }

        .warning {

            margin-top: 20px;

            color: #888;

            font-size: 12px;

            line-height: 1.5;

        }

        .erro {

            color: #ff4444;

            font-size: 18px;

            line-height: 1.6;

        }

    </style>

</head>


<body>


    <div class="ticket">

        <div class="icon">
            🎃
        </div>

        <h1>HALLOWEEN 2026</h1>

        <div class="subtitle">
            INGRESSO INDIVIDUAL
        </div>


        <div id="conteudo">

            <div class="erro">
                Carregando ingresso...
            </div>

        </div>


    </div>


    <!-- Biblioteca gratuita para gerar QR Code -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>


    <script>

        const parametros =
            new URLSearchParams(window.location.search);


        const id =
            parametros.get("id");


        const conteudo =
            document.getElementById("conteudo");


        if (!id) {

            conteudo.innerHTML = `

                <div class="erro">

                    Ingresso inválido.

                    <br><br>

                    Nenhum ID foi informado.

                </div>

            `;

        }

        else {

            conteudo.innerHTML = `

                <div class="info">

                    <p>
                        <span class="label">Ingresso:</span>
                        Halloween 2026
                    </p>

                    <p>
                        <span class="label">ID:</span>
                        ${id}
                    </p>

                </div>


                <div class="qr-area">

                    <div id="qrcode"></div>

                </div>


                <p class="qr-text">

                    Apresente este QR Code na entrada do evento.

                    <br>

                    Este ingresso é individual e não deve ser compartilhado.

                </p>


                <div class="id">

                    ${id}

                </div>


                <p class="warning">

                    31 de Outubro de 2026

                    <br>

                    Rua Nigeria, 346 — Outeiro de Passargada

                    <br>

                    06719-630

                </p>

            `;


            new QRCode(
                document.getElementById("qrcode"),
                {
                    text: id,
                    width: 220,
                    height: 220
                }
            );

        }

    </script>


</body>

</html>
