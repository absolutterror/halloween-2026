<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pagamento — Halloween 2026</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            background:
                radial-gradient(circle at top, #321000 0%, #0b0b0b 45%, #000 100%);

            color: white;

            font-family: Arial, Helvetica, sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px;

        }

        .payment-box {

            width: 100%;

            max-width: 430px;

            background: #111;

            border: 1px solid #333;

            border-radius: 18px;

            padding: 30px 25px;

            text-align: center;

            box-shadow:
                0 0 30px rgba(255, 69, 0, 0.18);

        }

        .icon {

            font-size: 55px;

            margin-bottom: 10px;

        }

        h1 {

            color: #ff5a00;

            font-size: 28px;

            letter-spacing: 1px;

            margin-bottom: 8px;

        }

        .subtitle {

            color: #aaa;

            font-size: 14px;

            margin-bottom: 25px;

        }

        .ticket-info {

            background: #181818;

            border-left: 4px solid #ff5a00;

            border-radius: 10px;

            padding: 18px;

            text-align: left;

            margin-bottom: 25px;

        }

        .ticket-info p {

            margin-bottom: 12px;

            color: #ddd;

        }

        .ticket-info p:last-child {

            margin-bottom: 0;

        }

        .label {

            color: #ff5a00;

            font-weight: bold;

        }

        .price {

            font-size: 30px;

            font-weight: bold;

            color: #fff;

        }

        .copy-button {

            width: 100%;

            padding: 16px;

            border: none;

            border-radius: 10px;

            background: #ff5a00;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-bottom: 20px;

        }

        .copy-button:hover {

            background: #ff6f26;

        }

        .message {

            color: #aaa;

            font-size: 14px;

            line-height: 1.7;

        }

        .back {

            display: inline-block;

            margin-top: 22px;

            color: #888;

            text-decoration: none;

            font-size: 13px;

        }

        .back:hover {

            color: #ff5a00;

        }

    </style>

</head>


<body>


    <div class="payment-box">


        <div class="icon">
            💀
        </div>


        <h1>
            PAGAMENTO
        </h1>


        <div class="subtitle">
            HALLOWEEN 2026
        </div>


        <div class="ticket-info">


            <p>

                <span class="label">
                    Ingresso:
                </span>

                <span id="tipoIngresso">
                    Carregando...
                </span>

            </p>


            <p>

                <span class="label">
                    Valor:
                </span>

                <span class="price" id="valorIngresso">
                    --
                </span>

            </p>


        </div>


        <button
            class="copy-button"
            onclick="copiarPix()">

            📋 COPIAR PIX

        </button>


        <div class="message">

            Clique no botão acima para copiar o Pix
            e realizar o pagamento.

            <br><br>

            O valor do ingresso já estará preenchido
            no aplicativo do seu banco.

            <br><br>

            Após realizar o pagamento,
            aguarde a confirmação.

        </div>


        <a
            href="index.html"
            class="back">

            ← Voltar para o início

        </a>


    </div>


    <script>


        const parametros =
            new URLSearchParams(
                window.location.search
            );


        const tipo =
            parametros.get("tipo");


        const tipoIngresso =
            document.getElementById(
                "tipoIngresso"
            );


        const valorIngresso =
            document.getElementById(
                "valorIngresso"
            );


        let valor = 0;


        if (tipo === "masculino") {

            tipoIngresso.textContent =
                "👨 Masculino";

            valorIngresso.textContent =
                "R$ 30";

            valor = 30;

        }


        else if (tipo === "feminino") {

            tipoIngresso.textContent =
                "👩 Feminino";

            valorIngresso.textContent =
                "R$ 20";

            valor = 20;

        }


        else {

            tipoIngresso.textContent =
                "Ingresso não selecionado";

            valorIngresso.textContent =
                "--";

        }


        function gerarPix(valor) {


            const chavePix =
                "11988884547";


            const nome =
                "HENRIQUE SILVA REBOUCAS";


            const cidade =
                "COTIA";


            const valorFormatado =
                valor.toFixed(2);


            function campo(id, valor) {

                return (
                    id +
                    String(valor.length).padStart(2, "0") +
                    valor
                );

            }


            const payloadSemCRC =

                campo("00", "01") +

                campo("26",
                    campo("00", "BR.GOV.BCB.PIX") +
                    campo("01", chavePix)
                ) +

                campo("52", "0000") +

                campo("53", "986") +

                campo("54", valorFormatado) +

                campo("58", "BR") +

                campo("59", nome.substring(0, 25)) +

                campo("60", cidade.substring(0, 15)) +

                campo("62",
                    campo("05", "***")
                ) +

                "6304";


            function crc16(str) {

                let crc = 0xFFFF;


                for (
                    let i = 0;
                    i < str.length;
                    i++
                ) {

                    crc ^= str.charCodeAt(i) << 8;


                    for (
                        let j = 0;
                        j < 8;
                        j++
                    ) {

                        if (
                            crc & 0x8000
                        ) {

                            crc =
                                (crc << 1) ^
                                0x1021;

                        }

                        else {

                            crc =
                                crc << 1;

                        }

                        crc &= 0xFFFF;

                    }

                }


                return crc
                    .toString(16)
                    .toUpperCase()
                    .padStart(4, "0");

            }


            return (
                payloadSemCRC +
                crc16(payloadSemCRC)
            );

        }


        function copiarPix() {


            if (!valor) {

                alert(
                    "Ingresso não selecionado."
                );

                return;

            }


            const codigoPix =
                gerarPix(valor);


            navigator.clipboard.writeText(
                codigoPix
            );


            const botao =
                document.querySelector(
                    ".copy-button"
                );


            botao.textContent =
                "✓ PIX COPIADO!";


            setTimeout(
                function() {

                    botao.textContent =
                        "📋 COPIAR PIX";

                },
                2500
            );

        }


    </script>


</body>

</html>
