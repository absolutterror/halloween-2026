<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Controle de Entrada - Halloween 2026</title>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --laranja: #ff7100;
      --laranja-claro: #ff9d32;
      --verde: #20ff57;
      --vermelho: #ff3030;
      --fundo: #050505;
      --painel: #0c0c0c;
      --borda: #27333a;
      --texto: #f5f5f5;
      --cinza: #9ca8ad;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, #281200 0%, transparent 32%),
        radial-gradient(circle at 10% 90%, #1c0800 0%, transparent 25%),
        radial-gradient(circle at 90% 90%, #1c0800 0%, transparent 25%),
        var(--fundo);

      color: var(--texto);
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    body::before {
      content: "🕷";
      position: fixed;
      top: 10px;
      left: 10px;
      font-size: 55px;
      opacity: 0.15;
      pointer-events: none;
    }

    body::after {
      content: "🕸";
      position: fixed;
      top: 0;
      right: 0;
      font-size: 100px;
      opacity: 0.12;
      pointer-events: none;
    }

    .container {
      width: 100%;
      max-width: 650px;
      margin: 0 auto;
      padding: 25px 16px 35px;
      position: relative;
      z-index: 1;
    }

    /* ======================================================
       CABEÇALHO
    ====================================================== */

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .pumpkin {
      font-size: 48px;
      line-height: 1;
      margin-bottom: 8px;
      filter: drop-shadow(0 0 12px rgba(255, 113, 0, 0.5));
    }

    .titulo {
      margin: 0;
      color: var(--laranja);
      font-size: clamp(32px, 9vw, 54px);
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow:
        0 0 8px rgba(255, 113, 0, 0.5),
        0 0 25px rgba(255, 113, 0, 0.25);
    }

    .ano {
      margin-top: -4px;
      color: white;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 8px;
    }

    .linha-titulo {
      width: 80px;
      height: 3px;
      background: var(--laranja);
      margin: 12px auto;
      box-shadow: 0 0 10px rgba(255, 113, 0, 0.7);
    }

    .controle {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .equipe {
      color: var(--laranja);
      margin-top: 7px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 4px;
    }

    /* ======================================================
       PAINEL SCANNER
    ====================================================== */

    .scanner-card {
      background: rgba(10, 10, 10, 0.96);
      border: 1px solid #31505a;
      border-radius: 22px;
      padding: 15px;
      box-shadow:
        0 0 30px rgba(0, 0, 0, 0.7),
        inset 0 0 30px rgba(0, 0, 0, 0.5);
    }

    .scanner-title {
      text-align: center;
      margin: 5px 0 15px;
      color: var(--cinza);
      font-size: 14px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    #reader {
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      overflow: hidden;
      border-radius: 16px;
    }

    #reader video {
      border-radius: 16px;
    }

    #reader__dashboard {
      padding: 8px !important;
    }

    #reader__dashboard button {
      background: var(--laranja) !important;
      color: white !important;
      border: none !important;
      border-radius: 8px !important;
      padding: 10px 14px !important;
      font-weight: bold !important;
    }

    #reader__dashboard select {
      background: #111 !important;
      color: white !important;
      border: 1px solid #555 !important;
      padding: 8px !important;
      border-radius: 7px !important;
    }

    #reader__scan_region {
      border-radius: 16px;
      overflow: hidden;
    }

    .scanner-instrucao {
      text-align: center;
      color: #aeb9bd;
      margin: 15px 0 5px;
      font-size: 15px;
    }

    /* ======================================================
       CARREGANDO
    ====================================================== */

    .carregando {
      display: none;
      text-align: center;
      margin: 18px 0;
      color: var(--laranja-claro);
      font-weight: bold;
      animation: pulsar 1s infinite;
    }

    @keyframes pulsar {
      50% {
        opacity: 0.45;
      }
    }

    /* ======================================================
       RESULTADO
    ====================================================== */

    .resultado {
      display: none;
      margin-top: 20px;
      border-radius: 22px;
      padding: 25px 20px;
      position: relative;
      overflow: hidden;
    }

    .resultado::after {
      content: "🎃";
      position: absolute;
      right: -10px;
      bottom: -20px;
      font-size: 130px;
      opacity: 0.10;
      pointer-events: none;
    }

    .resultado.sucesso {
      background:
        radial-gradient(circle at 80% 20%, rgba(32, 255, 87, 0.13), transparent 35%),
        #061109;

      border: 2px solid var(--verde);

      box-shadow:
        0 0 20px rgba(32, 255, 87, 0.25),
        inset 0 0 35px rgba(32, 255, 87, 0.04);
    }

    .resultado.erro {
      background:
        radial-gradient(circle at 80% 20%, rgba(255, 48, 48, 0.15), transparent 35%),
        #160606;

      border: 2px solid var(--vermelho);

      box-shadow:
        0 0 20px rgba(255, 48, 48, 0.22),
        inset 0 0 35px rgba(255, 48, 48, 0.04);
    }

    .icone-resultado {
      font-size: 65px;
      line-height: 1;
      margin-bottom: 10px;
    }

    .resultado h2 {
      margin: 0 0 22px;
      font-size: clamp(28px, 8vw, 44px);
      font-weight: 900;
      letter-spacing: 1px;
    }

    .sucesso h2 {
      color: var(--verde);
      text-shadow: 0 0 15px rgba(32, 255, 87, 0.35);
    }

    .erro h2 {
      color: #ff4545;
      text-shadow: 0 0 15px rgba(255, 48, 48, 0.35);
    }

    .mensagem-boas-vindas {
      display: none;
      color: var(--verde);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 4px;
      margin-top: -12px;
      margin-bottom: 20px;
    }

    .dados {
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 15px;
      padding: 5px 15px;
      text-align: left;
    }

    .dado {
      padding: 14px 4px;
      border-bottom: 1px solid rgba(255,255,255,0.10);
    }

    .dado:last-child {
      border-bottom: none;
    }

    .dado-label {
      display: block;
      color: #8f9ca1;
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .dado-valor {
      display: block;
      color: white;
      font-size: 20px;
      font-weight: bold;
      word-break: break-word;
    }

    /* ======================================================
       BOTÃO
    ====================================================== */

    .botao {
      width: 100%;
      border: none;
      border-radius: 13px;
      padding: 17px;
      margin-top: 20px;
      background: linear-gradient(
        135deg,
        var(--laranja),
        #ff8d18
      );
      color: #080808;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow:
        0 5px 20px rgba(255, 113, 0, 0.25);
      transition: 0.2s;
    }

    .botao:hover {
      transform: translateY(-2px);
      box-shadow:
        0 8px 25px rgba(255, 113, 0, 0.4);
    }

    .botao:active {
      transform: scale(0.98);
    }

    /* ======================================================
       VALIDAÇÃO MANUAL
    ====================================================== */

    .manual {
      margin-top: 22px;
      background: rgba(10, 10, 10, 0.95);
      border: 1px solid #27343a;
      border-radius: 18px;
      padding: 18px;
    }

    .manual-titulo {
      margin: 0 0 12px;
      color: #aeb9bd;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .manual-area {
      display: flex;
      gap: 10px;
    }

    .manual input {
      min-width: 0;
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #45545b;
      background: #080808;
      color: white;
      font-size: 15px;
      text-align: center;
      text-transform: uppercase;
      outline: none;
    }

    .manual input:focus {
      border-color: var(--laranja);
      box-shadow: 0 0 10px rgba(255, 113, 0, 0.15);
    }

    .botao-manual {
      border: 1px solid var(--laranja);
      border-radius: 10px;
      background: transparent;
      color: var(--laranja);
      padding: 0 18px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .botao-manual:hover {
      background: var(--laranja);
      color: #080808;
    }

    /* ======================================================
       RODAPÉ
    ====================================================== */

    .footer {
      text-align: center;
      margin-top: 30px;
      color: #69757a;
      font-size: 11px;
      letter-spacing: 6px;
      text-transform: uppercase;
    }

    .footer-linha {
      width: 90px;
      height: 1px;
      background: var(--laranja);
      margin: 0 auto 12px;
      opacity: 0.7;
    }

    /* ======================================================
       CELULAR
    ====================================================== */

    @media (max-width: 500px) {

      .container {
        padding: 18px 12px 25px;
      }

      .titulo {
        font-size: 35px;
      }

      .controle {
        font-size: 17px;
      }

      .equipe {
        font-size: 10px;
        letter-spacing: 3px;
      }

      .scanner-card {
        padding: 10px;
      }

      .resultado {
        padding: 22px 15px;
      }

      .manual-area {
        flex-direction: column;
      }

      .botao-manual {
        min-height: 48px;
      }

      .dado-valor {
        font-size: 18px;
      }
    }
  </style>
</head>


<body>

<div class="container">

  <!-- ======================================================
       CABEÇALHO
  ======================================================= -->

  <header class="header">

    <div class="pumpkin">🎃</div>

    <h1 class="titulo">
      Halloween
    </h1>

    <div class="ano">
      2026
    </div>

    <div class="linha-titulo"></div>

    <h2 class="controle">
      Controle de Entrada
    </h2>

    <div class="equipe">
      EQUIPE DE SEGURANÇA
    </div>

  </header>


  <!-- ======================================================
       SCANNER
  ======================================================= -->

  <section class="scanner-card">

    <div class="scanner-title">
      Leitor de ingresso
    </div>

    <div id="reader"></div>

    <div class="scanner-instrucao">
      Aponte o QR Code para a câmera
    </div>

  </section>


  <!-- ======================================================
       CARREGANDO
  ======================================================= -->

  <div id="carregando" class="carregando">
    VALIDANDO INGRESSO...
  </div>


  <!-- ======================================================
       RESULTADO
  ======================================================= -->

  <section id="resultado" class="resultado">

    <div id="iconeResultado" class="icone-resultado">
      ✓
    </div>

    <h2 id="tituloResultado"></h2>

    <div
      id="mensagemBoasVindas"
      class="mensagem-boas-vindas">
      BEM-VINDO(A) À FESTA!
    </div>


    <div class="dados">

      <div class="dado">
        <span class="dado-label">
          Nome
        </span>

        <span
          id="nomeResultado"
          class="dado-valor">
        </span>
      </div>


      <div class="dado">
        <span class="dado-label">
          Tipo
        </span>

        <span
          id="tipoResultado"
          class="dado-valor">
        </span>
      </div>


      <div class="dado">
        <span class="dado-label">
          ID do ingresso
        </span>

        <span
          id="idResultado"
          class="dado-valor">
        </span>
      </div>

    </div>


    <button
      class="botao"
      onclick="novoScan()">

      ↻ &nbsp; ESCANEAR PRÓXIMO

    </button>

  </section>


  <!-- ======================================================
       VALIDAÇÃO MANUAL
  ======================================================= -->

  <section class="manual">

    <p class="manual-titulo">
      ⌨️ Validação manual
    </p>

    <div class="manual-area">

      <input
        type="text"
        id="idManual"
        placeholder="HW26-C28CEBFC"
        autocomplete="off"
      >

      <button
        class="botao-manual"
        onclick="validarManual()">

        VALIDAR

      </button>

    </div>

  </section>


  <!-- ======================================================
       RODAPÉ
  ======================================================= -->

  <footer class="footer">

    <div class="footer-linha"></div>

    HALLOWEEN 2026

  </footer>

</div>


<script>

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycby47FKISxM1brTG5wvQcEY5LBJcWfv6RO8p4ku7dBFJxfFNZp98bBbvptXaXk5Xfrzr/exec";


let scanner = null;
let processando = false;


/* ============================================================
   INICIAR SCANNER
============================================================ */

function iniciarScanner() {

  scanner =
    new Html5Qrcode("reader");


  scanner.start(

    {
      facingMode: "environment"
    },

    {
      fps: 10,

      qrbox: {
        width: 250,
        height: 250
      }
    },

    function(decodedText) {

      if (processando) {
        return;
      }

      processando = true;

      validarIngresso(decodedText);

    },

    function(errorMessage) {

      // Erros normais de leitura são ignorados.

    }

  ).catch(function(error) {

    mostrarErro(
      "NÃO FOI POSSÍVEL ACESSAR A CÂMERA"
    );

    console.error(error);

  });

}


/* ============================================================
   VALIDAR INGRESSO
============================================================ */

async function validarIngresso(id) {

  id =
    String(id).trim();


  if (!id) {

    mostrarErro(
      "QR CODE INVÁLIDO"
    );

    return;
  }


  document.getElementById(
    "carregando"
  ).style.display = "block";


  try {

    const url =
      APPS_SCRIPT_URL +
      "?acao=validarEntrada&id=" +
      encodeURIComponent(id);


    const resposta =
      await fetch(url);


    const dados =
      await resposta.json();


    document.getElementById(
      "carregando"
    ).style.display = "none";


    mostrarResultado(dados);

  }

  catch (erro) {

    document.getElementById(
      "carregando"
    ).style.display = "none";


    mostrarErro(
      "ERRO DE COMUNICAÇÃO COM O SERVIDOR"
    );


    console.error(erro);

  }

}


/* ============================================================
   MOSTRAR RESULTADO
============================================================ */

function mostrarResultado(dados) {

  const resultado =
    document.getElementById(
      "resultado"
    );


  const titulo =
    document.getElementById(
      "tituloResultado"
    );


  const nome =
    document.getElementById(
      "nomeResultado"
    );


  const tipo =
    document.getElementById(
      "tipoResultado"
    );


  const id =
    document.getElementById(
      "idResultado"
    );


  const icone =
    document.getElementById(
      "iconeResultado"
    );


  const boasVindas =
    document.getElementById(
      "mensagemBoasVindas"
    );


  resultado.className =
    "resultado";


  nome.textContent = "";
  tipo.textContent = "";
  id.textContent = "";


  boasVindas.style.display =
    "none";


  /* ==========================================================
     ENTRADA LIBERADA
  ========================================================== */

  if (
    dados.liberado === true
  ) {

    resultado.classList.add(
      "sucesso"
    );


    icone.textContent =
      "✓";


    titulo.textContent =
      "ENTRADA LIBERADA";


    boasVindas.style.display =
      "block";


    nome.textContent =
      dados.nome || "-";


    tipo.textContent =
      formatarTipo(
        dados.tipo
      );


    id.textContent =
      dados.id || "-";

  }


  /* ==========================================================
     ENTRADA NEGADA
  ========================================================== */

  else {

    resultado.classList.add(
      "erro"
    );


    icone.textContent =
      "✕";


    if (
      dados.motivo ===
      "JA_UTILIZADO"
    ) {

      titulo.textContent =
        "INGRESSO JÁ UTILIZADO";

    }

    else if (
      dados.motivo ===
      "NAO_PAGO"
    ) {

      titulo.textContent =
        "PAGAMENTO NÃO CONFIRMADO";

    }

    else if (
      dados.motivo ===
      "NAO_ENCONTRADO"
    ) {

      titulo.textContent =
        "INGRESSO NÃO ENCONTRADO";

    }

    else {

      titulo.textContent =
        "ENTRADA NÃO LIBERADA";

    }


    if (dados.nome) {

      nome.textContent =
        dados.nome;

    }


    if (dados.tipo) {

      tipo.textContent =
        formatarTipo(
          dados.tipo
        );

    }


    if (dados.id) {

      id.textContent =
        dados.id;

    }

  }


  resultado.style.display =
    "block";


  pararScanner();

}


/* ============================================================
   MOSTRAR ERRO
============================================================ */

function mostrarErro(mensagem) {

  const resultado =
    document.getElementById(
      "resultado"
    );


  const titulo =
    document.getElementById(
      "tituloResultado"
    );


  const icone =
    document.getElementById(
      "iconeResultado"
    );


  const boasVindas =
    document.getElementById(
      "mensagemBoasVindas"
    );


  resultado.className =
    "resultado erro";


  icone.textContent =
    "✕";


  titulo.textContent =
    mensagem;


  document.getElementById(
    "nomeResultado"
  ).textContent = "";


  document.getElementById(
    "tipoResultado"
  ).textContent = "";


  document.getElementById(
    "idResultado"
  ).textContent = "";


  boasVindas.style.display =
    "none";


  resultado.style.display =
    "block";


  pararScanner();

}


/* ============================================================
   PARAR SCANNER
============================================================ */

function pararScanner() {

  if (!scanner) {
    return;
  }


  scanner.stop()
    .then(function() {

      console.log(
        "Scanner parado."
      );

    })
    .catch(function(error) {

      console.log(
        "Scanner já estava parado.",
        error
      );

    });

}


/* ============================================================
   NOVO SCAN
============================================================ */

function novoScan() {

  const resultado =
    document.getElementById(
      "resultado"
    );


  resultado.style.display =
    "none";


  document.getElementById(
    "carregando"
  ).style.display =
    "none";


  document.getElementById(
    "idManual"
  ).value = "";


  processando = false;


  if (scanner) {

    scanner.clear()
      .then(function() {

        iniciarScanner();

      })
      .catch(function() {

        iniciarScanner();

      });

  }

  else {

    iniciarScanner();

  }

}


/* ============================================================
   VALIDAÇÃO MANUAL
============================================================ */

function validarManual() {

  const campo =
    document.getElementById(
      "idManual"
    );


  const id =
    campo.value.trim();


  if (!id) {

    mostrarErro(
      "DIGITE O ID DO INGRESSO"
    );

    return;
  }


  if (processando) {
    return;
  }


  processando = true;

  validarIngresso(id);

}


/* ============================================================
   FORMATAR TIPO
============================================================ */

function formatarTipo(tipo) {

  tipo =
    String(tipo || "")
      .toLowerCase();


  if (
    tipo === "masculino"
  ) {

    return "Masculino";

  }


  if (
    tipo === "feminino"
  ) {

    return "Feminino";

  }


  return tipo || "-";

}


/* ============================================================
   ENTER NO CAMPO MANUAL
============================================================ */

document.getElementById(
  "idManual"
).addEventListener(
  "keydown",
  function(event) {

    if (
      event.key === "Enter"
    ) {

      validarManual();

    }

  }
);


/* ============================================================
   INICIAR
============================================================ */

window.onload =
  function() {

    iniciarScanner();

  };

</script>

</body>
</html>
