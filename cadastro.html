    <div class="container">

        <h1>💀 CADASTRO</h1>

        <div class="subtitle">
            HALLOWEEN 2026

        <div
            class="ticket"
            id="ticketType"

                class="submit-button"
                id="botao"
            >

            </button>

        </form>

            href="index.html"
            class="back"
        >

        </a>

<script>

// ==========================================================
// CONFIGURAÇÃO
// ==========================================================

// Site fala com o Cloudflare Worker
// e não diretamente com o Google Apps Script.

const URL_API =
    "https://halloween-2026-webhook.henriquereboucas13.workers.dev";


// ==========================================================
// PARÂMETROS DA URL
// ==========================================================

const parametros =
    new URLSearchParams(
        window.location.search
    );

const tipo =
    parametros.get("tipo");


// ==========================================================
// ELEMENTOS
// ==========================================================

const ticketType =
    document.getElementById(
        "ticketType"
    );

const formulario =
    document.getElementById(
        "formulario"
    );

const botao =
    document.getElementById(
        "botao"
    );


// ==========================================================
// VALOR DO INGRESSO
// ==========================================================

let valor = "";


if (tipo === "masculino") {

    ticketType.textContent =
        "👨 Masculino — R$ 30";

    valor = "30";

}

else if (tipo === "feminino") {

    ticketType.textContent =
        "👩 Feminino — R$ 20";

    valor = "20";

}

else {

    ticketType.textContent =
        "Ingresso não selecionado";

    botao.disabled = true;

}


// ==========================================================
// ENVIO DO FORMULÁRIO
// ==========================================================

formulario.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        // ==================================================
        // CONFERE TIPO
        // ==================================================

        if (
            tipo !== "masculino" &&
            tipo !== "feminino"
        ) {

            alert(
                "Tipo de ingresso inválido."
            );

            return;
        }


        // ==================================================
        // PEGA DADOS
        // ==================================================

        const nome =
            document.getElementById(
                "nome"
            ).value.trim();

        const whatsapp =
            document.getElementById(
                "whatsapp"
            ).value.trim();


        // ==================================================
        // CONFERE CAMPOS
        // ==================================================

        if (!nome || !whatsapp) {

            alert(
                "Preencha seu nome e WhatsApp."
            );

            return;
        }


        // ==================================================
        // GERA ID
        // ==================================================

        const id =
            "HW26-" +
            crypto.randomUUID()
                .replace(/-/g, "")
                .substring(0, 8)
                .toUpperCase();


        // ==================================================
        // DESABILITA BOTÃO
        // ==================================================

        botao.disabled = true;

        botao.textContent =
            "PROCESSANDO...";


        // ==================================================
        // DADOS ENVIADOS
        // ==================================================

        const dados = {

            id: id,

            nome: nome,

            whatsapp: whatsapp,

            tipo: tipo,

            valor: valor

        };


        console.log(
            "Dados enviados:",
            dados
        );


        try {

            // ==================================================
            // ENVIA PARA O CLOUDFLARE WORKER
            // ==================================================

            const resposta =
                await fetch(
                    URL_API,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "text/plain;charset=utf-8"

                        },

                        body:
                            JSON.stringify(dados)

                    }
                );


            // ==================================================
            // CONFERE HTTP
            // ==================================================

            if (!resposta.ok) {

                throw new Error(
                    "Erro HTTP " +
                    resposta.status
                );

            }


            // ==================================================
            // LÊ RESPOSTA
            // ==================================================

            const resultado =
                await resposta.json();


            console.log(
                "Resposta do sistema:",
                resultado
            );


            // ==================================================
            // CONFERE SUCESSO
            // ==================================================

            if (
                !resultado.sucesso
            ) {

                throw new Error(
                    resultado.mensagem ||
                    "Não foi possível criar o ingresso."
                );

            }


            // ==================================================
            // CONFERE PAYMENT ID
            // ==================================================

            if (
                !resultado.paymentId
            ) {

                throw new Error(
                    "O pagamento não foi criado no Asaas."
                );

            }


            // ==================================================
            // SUCESSO
            // ==================================================

            botao.textContent =
                "INGRESSO CRIADO!";


            // ==================================================
            // VAI PARA PAGAMENTO
            // ==================================================

            window.location.href =
                "pagamento.html?tipo=" +
                encodeURIComponent(tipo) +
                "&id=" +
                encodeURIComponent(id);

        }

        catch (erro) {

            console.error(
                "Erro:",
                erro
            );


            alert(
                "Não foi possível criar o ingresso.\n\n" +
                erro.message
            );


            botao.disabled =
                false;

            botao.textContent =
                "CONTINUAR";

        }

    }
);

</script>

</body>
