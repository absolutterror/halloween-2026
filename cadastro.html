<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro — Halloween 2026</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            min-height: 100vh;

            background:
                radial-gradient(circle at top, #321000 0%, #0b0b0b 45%, #000 100%);

            color: white;

            font-family: Arial, Helvetica, sans-serif;

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 25px;

        }

        .form-box {

            width: 100%;

            max-width: 430px;

            background: #111;

            border: 1px solid #333;

            border-radius: 18px;

            padding: 30px 25px;

            box-shadow:
                0 0 30px rgba(255, 69, 0, 0.18);

        }

        .icon {

            text-align: center;

            font-size: 55px;

            margin-bottom: 10px;

        }

        h1 {

            text-align: center;

            color: #ff5a00;

            font-size: 28px;

            letter-spacing: 1px;

            margin-bottom: 8px;

        }

        .subtitle {

            text-align: center;

            color: #aaa;

            font-size: 14px;

            margin-bottom: 25px;

        }

        .ticket-type {

            background: #181818;

            border-left: 4px solid #ff5a00;

            border-radius: 10px;

            padding: 16px;

            margin-bottom: 25px;

            text-align: center;

            color: #ff5a00;

            font-weight: bold;

            font-size: 17px;

        }

        label {

            display: block;

            color: #ddd;

            font-size: 14px;

            margin-bottom: 7px;

        }

        input {

            width: 100%;

            padding: 14px;

            background: #080808;

            border: 1px solid #333;

            border-radius: 9px;

            color: white;

            font-size: 15px;

            outline: none;

            margin-bottom: 18px;

        }

        input:focus {

            border-color: #ff5a00;

        }

        .submit-button {

            width: 100%;

            padding: 16px;

            border: none;

            border-radius: 10px;

            background: #ff5a00;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;

        }

        .submit-button:hover {

            background: #ff6f26;

        }

        .submit-button:disabled {

            opacity: 0.6;

            cursor: not-allowed;

        }

        .back {

            display: block;

            text-align: center;

            margin-top: 22px;

            color: #888;

            text-decoration: none;

            font-size: 13px;

        }

        .back:hover {

            color: #ff5a00;

        }

    </style>

</head>


<body>


    <div class="form-box">


        <div class="icon">
            🎃
        </div>


        <h1>
            CADASTRO
        </h1>


        <div class="subtitle">
            HALLOWEEN 2026
        </div>


        <div
            class="ticket-type"
            id="ticketType">

            Carregando...

        </div>


        <form>


            <label for="nome">
                Nome completo
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Digite seu nome completo"
                required>


            <label for="whatsapp">
                WhatsApp
            </label>

            <input
                type="tel"
                id="whatsapp"
                placeholder="(11) 99999-9999"
                required>


            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required>


            <button
                type="submit"
                class="submit-button">

                CONTINUAR

            </button>


        </form>


        <a
            href="index.html"
            class="back">

            ← Voltar para o início

        </a>


    </div>


    <script>


        const URL_SCRIPT =
            "https://script.google.com/macros/s/AKfycby47FKISxM1brTG5wvQcEY5LBjCWfv6RO8p4ku7dBFJxfFNZp98bBbvptXaXk5Xfrzr/exec";


        const parametros =
            new URLSearchParams(
                window.location.search
            );


        const tipo =
            parametros.get("tipo");


        const ticketType =
            document.getElementById(
                "ticketType"
            );


        let valor = "";


        if (tipo === "masculino") {

            ticketType.textContent =
                "👨 Masculino — R$ 30";

            valor = "30";

        }

        else if (tipo === "feminino") {

            ticketType.textContent =
                "👩 Feminino — R$ 20";

            valor = "20";

        }

        else {

            ticketType.textContent =
                "Ingresso não selecionado";

        }


        const formulario =
            document.querySelector("form");


        formulario.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const nome =
                    document.getElementById(
                        "nome"
                    ).value;


                const whatsapp =
                    document.getElementById(
                        "whatsapp"
                    ).value;


                const email =
                    document.getElementById(
                        "email"
                    ).value;


                const botao =
                    document.querySelector(
                        ".submit-button"
                    );


                botao.disabled = true;

                botao.textContent =
                    "ENVIANDO...";


                try {


                    await fetch(

                        URL_SCRIPT,

                        {

                            method: "POST",

                            mode: "no-cors",

                            headers: {

                                "Content-Type":
                                    "text/plain;charset=utf-8"

                            },

                            body:
                                JSON.stringify({

                                    nome: nome,

                                    whatsapp: whatsapp,

                                    email: email,

                                    tipo: tipo,

                                    valor: valor

                                })

                        }

                    );


                    /*
                     * Cadastro enviado com sucesso.
                     *
                     * Agora manda a pessoa
                     * diretamente para a página
                     * de pagamento.
                     */

                    window.location.href =
                        "pagamento.html?tipo="
                        + encodeURIComponent(tipo);


                }

                catch (erro) {


                    alert(
                        "Não foi possível enviar o cadastro. Tente novamente."
                    );


                    botao.disabled = false;

                    botao.textContent =
                        "CONTINUAR";


                }

            }

        );


    </script>


</body>

</html>
