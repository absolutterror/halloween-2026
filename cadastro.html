<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro — Halloween 2026</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #3a1200, #120600 45%, #000 100%);
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;

            background: rgba(15, 15, 15, 0.95);

            border: 1px solid #ff6600;
            border-radius: 15px;

            padding: 30px;

            box-shadow:
                0 0 25px rgba(255, 102, 0, 0.25);
        }

        h1 {
            text-align: center;
            color: #ff6600;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }

        .ticket {
            text-align: center;

            background: #1c1c1c;

            border: 1px solid #ff6600;
            border-radius: 10px;

            padding: 15px;

            margin-bottom: 25px;

            color: #ff8c33;

            font-weight: bold;
        }

        label {
            display: block;

            margin-top: 15px;
            margin-bottom: 6px;

            color: #ddd;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 13px;

            border-radius: 8px;

            border: 1px solid #555;

            background: #111;

            color: white;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #ff6600;

            box-shadow:
                0 0 8px rgba(255, 102, 0, 0.3);
        }

        .submit-button {
            width: 100%;

            margin-top: 25px;

            padding: 15px;

            border: none;

            border-radius: 8px;

            background: #ff6600;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .submit-button:hover {
            background: #ff7b26;
        }

        .submit-button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #aaa;

            text-decoration: none;
        }

        .back:hover {
            color: #ff6600;
        }
    </style>

</head>

<body>

    <div class="container">

        <h1>💀 CADASTRO</h1>

        <div class="subtitle">
            HALLOWEEN 2026
        </div>

        <div class="ticket" id="ticketType">
            Carregando...
        </div>

        <form>

            <label for="nome">
                Nome completo
            </label>

            <input
                type="text"
                id="nome"
                required
            >

            <label for="whatsapp">
                WhatsApp
            </label>

            <input
                type="tel"
                id="whatsapp"
                required
            >

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                required
            >

            <button
                type="submit"
                class="submit-button"
            >
                CONTINUAR
            </button>

        </form>

        <a
            href="index.html"
            class="back"
        >
            ← Voltar
        </a>

    </div>


<script>

const URL_SCRIPT =
    "https://script.google.com/macros/s/AKfycby47FKISxM1brTG5wvQcEY5LBJcWfv6RO8p4ku7dBFJxfFNZp98bBbvptXaXk5Xfrzr/exec";


const parametros =
    new URLSearchParams(window.location.search);


const tipo =
    parametros.get("tipo");


const ticketType =
    document.getElementById("ticketType");


let valor = "";


if (tipo === "masculino") {

    ticketType.textContent =
        "👨 Masculino — R$ 30";

    valor = "30";

}

else if (tipo === "feminino") {

    ticketType.textContent =
        "👩 Feminino — R$ 20";

    valor = "20";

}

else {

    ticketType.textContent =
        "Ingresso não selecionado";

}


const formulario =
    document.querySelector("form");


formulario.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const nome =
            document.getElementById("nome").value;

        const whatsapp =
            document.getElementById("whatsapp").value;

        const email =
            document.getElementById("email").value;


        const botao =
            document.querySelector(".submit-button");


        /*
         * GERA O ID ÚNICO DO INGRESSO
         */

        const id =
            "HW26-" +
            crypto.randomUUID()
                .replace(/-/g, "")
                .substring(0, 8)
                .toUpperCase();


        botao.disabled = true;

        botao.textContent =
            "ENVIANDO...";


        try {

            await fetch(URL_SCRIPT, {

                method: "POST",

                mode: "no-cors",

                headers: {

                    "Content-Type":
                        "text/plain;charset=utf-8"

                },

                body: JSON.stringify({

                    id: id,

                    nome: nome,

                    whatsapp: whatsapp,

                    email: email,

                    tipo: tipo,

                    valor: valor

                })

            });


            /*
             * ENVIA O MESMO ID PARA A PÁGINA DE PAGAMENTO
             */

            window.location.href =
                "pagamento.html?tipo=" +
                encodeURIComponent(tipo) +
                "&id=" +
                encodeURIComponent(id);


        }

        catch (erro) {

            alert(
                "Não foi possível enviar o cadastro. Tente novamente."
            );


            botao.disabled = false;

            botao.textContent =
                "CONTINUAR";

        }

    }
);

</script>

</body>

</html>
