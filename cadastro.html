<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro - Halloween 2026</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #3a0000 0%, #120000 35%, #050505 75%);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: rgba(10, 10, 10, 0.95);
      border: 2px solid #ff5a00;
      border-radius: 18px;
      padding: 30px 25px;
      box-shadow: 0 0 30px rgba(255, 80, 0, 0.35);
    }

    h1 {
      text-align: center;
      color: #ff5a00;
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 32px;
      letter-spacing: 2px;
    }

    .subtitulo {
      text-align: center;
      color: #ccc;
      margin-bottom: 30px;
      font-size: 14px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
      color: #fff;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #171717;
      color: #fff;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #ff5a00;
      box-shadow: 0 0 8px rgba(255, 90, 0, 0.35);
    }

    .ingressos {
      display: flex;
      gap: 12px;
      margin-top: 10px;
    }

    .ingresso {
      flex: 1;
      padding: 18px 10px;
      border: 2px solid #555;
      background: #151515;
      color: white;
      border-radius: 10px;
      cursor: pointer;
      text-align: center;
      transition: 0.2s;
    }

    .ingresso:hover {
      border-color: #ff5a00;
    }

    .ingresso.selecionado {
      border-color: #ff5a00;
      background: #2a0d00;
      box-shadow: 0 0 15px rgba(255, 90, 0, 0.3);
    }

    .ingresso strong {
      display: block;
      font-size: 18px;
      margin-bottom: 5px;
    }

    .preco {
      color: #ff7b32;
      font-weight: bold;
      font-size: 20px;
    }

    button#continuar {
      width: 100%;
      margin-top: 28px;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #ff5a00;
      color: #fff;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button#continuar:hover {
      background: #ff7300;
      transform: scale(1.01);
    }

    button#continuar:disabled {
      background: #555;
      cursor: not-allowed;
      transform: none;
    }

    #mensagem {
      margin-top: 18px;
      text-align: center;
      font-weight: bold;
      min-height: 22px;
    }

    .erro {
      color: #ff4444;
    }

    .sucesso {
      color: #00ff88;
    }

    .carregando {
      color: #ffb000;
    }

    .aviso {
      margin-top: 18px;
      font-size: 12px;
      color: #999;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>HALLOWEEN 2026</h1>

    <div class="subtitulo">
      Preencha seus dados e escolha seu ingresso
    </div>

    <label for="nome">Nome completo</label>
    <input
      type="text"
      id="nome"
      placeholder="Digite seu nome"
      autocomplete="name"
    >

    <label for="whatsapp">WhatsApp</label>
    <input
      type="tel"
      id="whatsapp"
      placeholder="(11) 99999-9999"
      maxlength="15"
      autocomplete="tel"
    >

    <label for="cpf">CPF</label>
    <input
      type="text"
      id="cpf"
      placeholder="000.000.000-00"
      maxlength="14"
      inputmode="numeric"
    >

    <label>Escolha seu ingresso</label>

    <div class="ingressos">

      <div
        class="ingresso"
        id="masculino"
        data-tipo="Masculino"
        data-valor="30"
      >
        <strong>Masculino</strong>
        <span class="preco">R$ 30,00</span>
      </div>

      <div
        class="ingresso"
        id="feminino"
        data-tipo="Feminino"
        data-valor="20"
      >
        <strong>Feminino</strong>
        <span class="preco">R$ 20,00</span>
      </div>

    </div>

    <button id="continuar">
      CONTINUAR PARA PAGAMENTO
    </button>

    <div id="mensagem"></div>

    <div class="aviso">
      Seus dados serão utilizados para gerar o ingresso e o pagamento.
    </div>

  </div>

<script>

  // ============================================================
  // CONFIGURAÇÃO
  // ============================================================

  const URL_API =
    "https://halloween-2026-webhook.henriquereboucas13.workers.dev";


  // ============================================================
  // ELEMENTOS
  // ============================================================

  const nomeInput =
    document.getElementById("nome");

  const whatsappInput =
    document.getElementById("whatsapp");

  const cpfInput =
    document.getElementById("cpf");

  const masculino =
    document.getElementById("masculino");

  const feminino =
    document.getElementById("feminino");

  const continuar =
    document.getElementById("continuar");

  const mensagem =
    document.getElementById("mensagem");


  let tipoSelecionado = "";
  let valorSelecionado = 0;


  // ============================================================
  // MÁSCARA WHATSAPP
  // ============================================================

  whatsappInput.addEventListener("input", function () {

    let valor =
      this.value.replace(/\D/g, "");

    if (valor.length > 11) {
      valor = valor.substring(0, 11);
    }

    if (valor.length <= 10) {

      valor =
        valor.replace(
          /^(\d{2})(\d)/,
          "($1) $2"
        );

      valor =
        valor.replace(
          /(\d{4})(\d)/,
          "$1-$2"
        );

    } else {

      valor =
        valor.replace(
          /^(\d{2})(\d)/,
          "($1) $2"
        );

      valor =
        valor.replace(
          /(\d{5})(\d)/,
          "$1-$2"
        );
    }

    this.value = valor;
  });


  // ============================================================
  // MÁSCARA CPF
  // ============================================================

  cpfInput.addEventListener("input", function () {

    let valor =
      this.value.replace(/\D/g, "");

    if (valor.length > 11) {
      valor = valor.substring(0, 11);
    }

    valor =
      valor.replace(
        /(\d{3})(\d)/,
        "$1.$2"
      );

    valor =
      valor.replace(
        /(\d{3})(\d)/,
        "$1.$2"
      );

    valor =
      valor.replace(
        /(\d{3})(\d{1,2})$/,
        "$1-$2"
      );

    this.value = valor;
  });


  // ============================================================
  // ESCOLHA DO INGRESSO
  // ============================================================

  masculino.addEventListener("click", function () {

    masculino.classList.add("selecionado");
    feminino.classList.remove("selecionado");

    tipoSelecionado = "Masculino";
    valorSelecionado = 30;
  });


  feminino.addEventListener("click", function () {

    feminino.classList.add("selecionado");
    masculino.classList.remove("selecionado");

    tipoSelecionado = "Feminino";
    valorSelecionado = 20;
  });


  // ============================================================
  // VALIDAR CPF
  // ============================================================

  function validarCPF(cpf) {

    cpf =
      cpf.replace(/\D/g, "");

    if (cpf.length !== 11) {
      return false;
    }

    // CPF com todos os números iguais
    if (/^(\d)\1+$/.test(cpf)) {
      return false;
    }

    let soma = 0;
    let resto;

    for (let i = 1; i <= 9; i++) {
      soma +=
        parseInt(cpf.substring(i - 1, i)) *
        (11 - i);
    }

    resto =
      (soma * 10) % 11;

    if (resto === 10 || resto === 11) {
      resto = 0;
    }

    if (
      resto !==
      parseInt(cpf.substring(9, 10))
    ) {
      return false;
    }

    soma = 0;

    for (let i = 1; i <= 10; i++) {
      soma +=
        parseInt(cpf.substring(i - 1, i)) *
        (12 - i);
    }

    resto =
      (soma * 10) % 11;

    if (resto === 10 || resto === 11) {
      resto = 0;
    }

    if (
      resto !==
      parseInt(cpf.substring(10, 11))
    ) {
      return false;
    }

    return true;
  }


  // ============================================================
  // GERAR ID DO INGRESSO
  // ============================================================

  function gerarId() {

    const caracteres =
      "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

    let codigo = "";

    for (let i = 0; i < 8; i++) {

      codigo +=
        caracteres.charAt(
          Math.floor(
            Math.random() *
            caracteres.length
          )
        );
    }

    return "HW26-" + codigo;
  }


  // ============================================================
  // CONTINUAR
  // ============================================================

  continuar.addEventListener("click", async function () {

    mensagem.className = "";
    mensagem.textContent = "";


    const nome =
      nomeInput.value.trim();

    const whatsapp =
      whatsappInput.value.trim();

    const cpf =
      cpfInput.value.trim();


    // ----------------------------------------------------------
    // VALIDAÇÕES
    // ----------------------------------------------------------

    if (!nome) {

      mensagem.className = "erro";
      mensagem.textContent =
        "Digite seu nome.";

      nomeInput.focus();

      return;
    }


    if (
      whatsapp.replace(/\D/g, "").length < 10
    ) {

      mensagem.className = "erro";
      mensagem.textContent =
        "Digite um WhatsApp válido.";

      whatsappInput.focus();

      return;
    }


    if (!validarCPF(cpf)) {

      mensagem.className = "erro";
      mensagem.textContent =
        "Digite um CPF válido.";

      cpfInput.focus();

      return;
    }


    if (!tipoSelecionado) {

      mensagem.className = "erro";
      mensagem.textContent =
        "Escolha seu ingresso.";

      return;
    }


    // ----------------------------------------------------------
    // DESABILITAR BOTÃO
    // ----------------------------------------------------------

    continuar.disabled = true;

    continuar.textContent =
      "GERANDO PAGAMENTO...";

    mensagem.className =
      "carregando";

    mensagem.textContent =
      "Aguarde, estamos criando seu ingresso...";


    try {

      // --------------------------------------------------------
      // GERAR ID
      // --------------------------------------------------------

      const id =
        gerarId();


      // --------------------------------------------------------
      // DADOS ENVIADOS AO WORKER
      // --------------------------------------------------------

      const dados = {

        id: id,

        nome: nome,

        whatsapp:
          whatsapp.replace(/\D/g, ""),

        cpfCnpj:
          cpf.replace(/\D/g, ""),

        tipo:
          tipoSelecionado,

        valor:
          valorSelecionado
      };


      console.log(
        "Dados enviados:",
        dados
      );


      // --------------------------------------------------------
      // ENVIAR PARA CLOUDFLARE WORKER
      // --------------------------------------------------------

      const resposta =
        await fetch(
          URL_API,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify(dados)
          }
        );


      const texto =
        await resposta.text();


      console.log(
        "Resposta do servidor:",
        texto
      );


      let resultado;

      try {

        resultado =
          JSON.parse(texto);

      } catch (erroJSON) {

        throw new Error(
          "O servidor retornou uma resposta inválida: " +
          texto
        );
      }


      // --------------------------------------------------------
      // VERIFICAR RESPOSTA
      // --------------------------------------------------------

      if (
        !resultado.sucesso
      ) {

        throw new Error(
          resultado.mensagem ||
          resultado.erro ||
          "Não foi possível criar o ingresso."
        );
      }


      if (
        !resultado.paymentId
      ) {

        throw new Error(
          "O Asaas não retornou o ID do pagamento."
        );
      }


      // --------------------------------------------------------
      // SUCESSO
      // --------------------------------------------------------

      mensagem.className =
        "sucesso";

      mensagem.textContent =
        "Ingresso criado! Redirecionando...";


      // --------------------------------------------------------
      // IR PARA PAGAMENTO
      // --------------------------------------------------------

      window.location.href =
        "pagamento.html?tipo=" +
        encodeURIComponent(tipoSelecionado) +
        "&id=" +
        encodeURIComponent(id);

    }

    catch (erro) {

      console.error(
        "ERRO:",
        erro
      );

      mensagem.className =
        "erro";

      mensagem.textContent =
        erro.message ||
        "Ocorreu um erro ao criar seu ingresso.";

      continuar.disabled =
        false;

      continuar.textContent =
        "CONTINUAR PARA PAGAMENTO";
    }

  });

</script>

</body>
</html>
