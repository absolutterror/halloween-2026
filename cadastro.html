<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cadastro - Halloween 2026</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      min-height: 100vh;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #3a0000 0%,
          #120000 35%,
          #050505 75%
        );

      color: #fff;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 20px;
    }

    .container {

      width: 100%;

      max-width: 500px;

      background:
        rgba(10, 10, 10, 0.95);

      border:
        2px solid #ff5a00;

      border-radius: 18px;

      padding: 30px 25px;

      box-shadow:
        0 0 30px
        rgba(255, 80, 0, 0.35);
    }

    h1 {

      text-align: center;

      color: #ff5a00;

      margin-top: 0;

      margin-bottom: 8px;

      font-size: 32px;

      letter-spacing: 2px;
    }

    .subtitulo {

      text-align: center;

      color: #ccc;

      margin-bottom: 30px;

      font-size: 14px;
    }

    label {

      display: block;

      margin-top: 18px;

      margin-bottom: 7px;

      font-weight: bold;

      color: #fff;
    }

    input {

      width: 100%;

      padding: 14px;

      border-radius: 8px;

      border:
        1px solid #555;

      background: #171717;

      color: #fff;

      font-size: 16px;

      outline: none;
    }

    input:focus {

      border-color: #ff5a00;

      box-shadow:
        0 0 8px
        rgba(255, 90, 0, 0.35);
    }

    button {

      width: 100%;

      margin-top: 28px;

      padding: 16px;

      border: none;

      border-radius: 10px;

      background: #ff5a00;

      color: #fff;

      font-size: 18px;

      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }

    button:hover {

      background: #ff7300;

      transform: scale(1.01);
    }

    button:disabled {

      background: #555;

      cursor: not-allowed;

      transform: none;
    }

    #mensagem {

      margin-top: 18px;

      text-align: center;

      font-weight: bold;

      min-height: 22px;
    }

    .erro {

      color: #ff4444;
    }

    .sucesso {

      color: #00ff88;
    }

    .carregando {

      color: #ffb000;
    }

    .aviso {

      margin-top: 18px;

      font-size: 12px;

      color: #999;

      text-align: center;

      line-height: 1.5;
    }

  </style>

</head>


<body>


  <div class="container">

    <h1>
      HALLOWEEN 2026
    </h1>


    <div class="subtitulo">

      Preencha seus dados
      para continuar

    </div>


    <!-- NOME -->

    <label for="nome">
      Nome completo
    </label>

    <input
      type="text"
      id="nome"
      placeholder="Digite seu nome"
      autocomplete="name"
    >


    <!-- WHATSAPP -->

    <label for="whatsapp">
      WhatsApp
    </label>

    <input
      type="tel"
      id="whatsapp"
      placeholder="(11) 99999-9999"
      maxlength="15"
      autocomplete="tel"
    >


    <!-- CPF -->

    <label for="cpf">
      CPF
    </label>

    <input
      type="text"
      id="cpf"
      placeholder="000.000.000-00"
      maxlength="14"
      inputmode="numeric"
    >


    <!-- BOTÃO -->

    <button id="continuar">

      CONTINUAR PARA PAGAMENTO

    </button>


    <div id="mensagem"></div>


    <div class="aviso">

      Seus dados serão utilizados
      para gerar o ingresso e o pagamento.

    </div>

  </div>


<script>


// ============================================================
// CONFIGURAÇÃO
// ============================================================

const URL_API =
  "https://halloween-2026-webhook.henriquereboucas13.workers.dev";


// ============================================================
// PEGAR O TIPO E VALOR DA URL
// ============================================================
//
// Exemplo:
//
// cadastro.html?tipo=Masculino&valor=30
//
// ou
//
// cadastro.html?tipo=Feminino&valor=20
//
// ============================================================

const parametros =
  new URLSearchParams(
    window.location.search
  );


const tipoSelecionado =
  parametros.get("tipo");


const valorSelecionado =
  Number(
    parametros.get("valor")
  );


// ============================================================
// ELEMENTOS
// ============================================================

const nomeInput =
  document.getElementById("nome");

const whatsappInput =
  document.getElementById("whatsapp");

const cpfInput =
  document.getElementById("cpf");

const continuar =
  document.getElementById("continuar");

const mensagem =
  document.getElementById("mensagem");


// ============================================================
// VERIFICAR SE O TIPO VEIO DA PÁGINA ANTERIOR
// ============================================================

if (
  !tipoSelecionado ||
  !valorSelecionado
) {

  mensagem.className =
    "erro";

  mensagem.textContent =
    "Ingresso não selecionado. Volte para a página anterior.";

  continuar.disabled = true;
}


// ============================================================
// MÁSCARA WHATSAPP
// ============================================================

whatsappInput.addEventListener(
  "input",
  function () {

    let valor =
      this.value.replace(
        /\D/g,
        ""
      );


    if (
      valor.length > 11
    ) {

      valor =
        valor.substring(
          0,
          11
        );
    }


    if (
      valor.length <= 10
    ) {

      valor =
        valor.replace(
          /^(\d{2})(\d)/,
          "($1) $2"
        );

      valor =
        valor.replace(
          /(\d{4})(\d)/,
          "$1-$2"
        );

    } else {

      valor =
        valor.replace(
          /^(\d{2})(\d)/,
          "($1) $2"
        );

      valor =
        valor.replace(
          /(\d{5})(\d)/,
          "$1-$2"
        );
    }


    this.value =
      valor;

  }
);


// ============================================================
// MÁSCARA CPF
// ============================================================

cpfInput.addEventListener(
  "input",
  function () {

    let valor =
      this.value.replace(
        /\D/g,
        ""
      );


    if (
      valor.length > 11
    ) {

      valor =
        valor.substring(
          0,
          11
        );
    }


    valor =
      valor.replace(
        /(\d{3})(\d)/,
        "$1.$2"
      );


    valor =
      valor.replace(
        /(\d{3})(\d)/,
        "$1.$2"
      );


    valor =
      valor.replace(
        /(\d{3})(\d{1,2})$/,
        "$1-$2"
      );


    this.value =
      valor;

  }
);


// ============================================================
// VALIDAR CPF
// ============================================================

function validarCPF(cpf) {

  cpf =
    cpf.replace(
      /\D/g,
      ""
    );


  if (
    cpf.length !== 11
  ) {

    return false;
  }


  if (
    /^(\d)\1+$/.test(cpf)
  ) {

    return false;
  }


  let soma = 0;

  let resto;


  for (
    let i = 1;
    i <= 9;
    i++
  ) {

    soma +=
      parseInt(
        cpf.substring(
          i - 1,
          i
        )
      ) *
      (11 - i);
  }


  resto =
    (soma * 10) % 11;


  if (
    resto === 10 ||
    resto === 11
  ) {

    resto = 0;
  }


  if (
    resto !==
    parseInt(
      cpf.substring(
        9,
        10
      )
    )
  ) {

    return false;
  }


  soma = 0;


  for (
    let i = 1;
    i <= 10;
    i++
  ) {

    soma +=
      parseInt(
        cpf.substring(
          i - 1,
          i
        )
      ) *
      (12 - i);
  }


  resto =
    (soma * 10) % 11;


  if (
    resto === 10 ||
    resto === 11
  ) {

    resto = 0;
  }


  if (
    resto !==
    parseInt(
      cpf.substring(
        10,
        11
      )
    )
  ) {

    return false;
  }


  return true;
}


// ============================================================
// GERAR ID
// ============================================================

function gerarId() {

  const caracteres =
    "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";


  let codigo = "";


  for (
    let i = 0;
    i < 8;
    i++
  ) {

    codigo +=
      caracteres.charAt(
        Math.floor(
          Math.random() *
          caracteres.length
        )
      );
  }


  return "HW26-" + codigo;
}


// ============================================================
// CONTINUAR
// ============================================================

continuar.addEventListener(
  "click",
  async function () {

    mensagem.className = "";

    mensagem.textContent = "";


    const nome =
      nomeInput.value.trim();


    const whatsapp =
      whatsappInput.value.trim();


    const cpf =
      cpfInput.value.trim();


    // --------------------------------------------------------
    // VALIDAÇÕES
    // --------------------------------------------------------

    if (!nome) {

      mensagem.className =
        "erro";

      mensagem.textContent =
        "Digite seu nome.";

      nomeInput.focus();

      return;
    }


    if (
      whatsapp.replace(
        /\D/g,
        ""
      ).length < 10
    ) {

      mensagem.className =
        "erro";

      mensagem.textContent =
        "Digite um WhatsApp válido.";

      whatsappInput.focus();

      return;
    }


    if (
      !validarCPF(cpf)
    ) {

      mensagem.className =
        "erro";

      mensagem.textContent =
        "Digite um CPF válido.";

      cpfInput.focus();

      return;
    }


    // --------------------------------------------------------
    // DESABILITAR
    // --------------------------------------------------------

    continuar.disabled =
      true;

    continuar.textContent =
      "GERANDO PAGAMENTO...";


    mensagem.className =
      "carregando";

    mensagem.textContent =
      "Aguarde, estamos criando seu ingresso...";


    try {


      // ------------------------------------------------------
      // GERAR ID
      // ------------------------------------------------------

      const id =
        gerarId();


      // ------------------------------------------------------
      // DADOS
      // ------------------------------------------------------

      const dados = {

        id:
          id,

        nome:
          nome,

        whatsapp:
          whatsapp.replace(
            /\D/g,
            ""
          ),

        cpfCnpj:
          cpf.replace(
            /\D/g,
            ""
          ),

        tipo:
          tipoSelecionado,

        valor:
          valorSelecionado
      };


      console.log(
        "Dados enviados:",
        dados
      );


      // ------------------------------------------------------
      // ENVIAR PARA WORKER
      // ------------------------------------------------------

      const resposta =
        await fetch(
          URL_API,
          {

            method:
              "POST",

            headers: {

              "Content-Type":
                "text/plain;charset=utf-8"
            },

            body:
              JSON.stringify(
                dados
              )
          }
        );


      const texto =
        await resposta.text();


      console.log(
        "Resposta:",
        texto
      );


      let resultado;


      try {

        resultado =
          JSON.parse(
            texto
          );

      } catch (erro) {

        throw new Error(
          "Resposta inválida do servidor: " +
          texto
        );
      }


      // ------------------------------------------------------
      // VERIFICAR
      // ------------------------------------------------------

      if (
        !resultado.sucesso
      ) {

        throw new Error(

          resultado.mensagem ||
          resultado.erro ||
          "Não foi possível criar o ingresso."
        );
      }


      if (
        !resultado.paymentId
      ) {

        throw new Error(
          "O Asaas não retornou o ID do pagamento."
        );
      }


      // ------------------------------------------------------
      // SUCESSO
      // ------------------------------------------------------

      mensagem.className =
        "sucesso";

      mensagem.textContent =
        "Ingresso criado! Redirecionando...";


      // ------------------------------------------------------
      // IR PARA PAGAMENTO
      // ------------------------------------------------------

      window.location.href =
        "pagamento.html?tipo=" +
        encodeURIComponent(
          tipoSelecionado
        ) +
        "&id=" +
        encodeURIComponent(
          id
        );

    }


    catch (erro) {

      console.error(
        "ERRO:",
        erro
      );


      mensagem.className =
        "erro";


      mensagem.textContent =
        erro.message ||
        "Ocorreu um erro ao criar seu ingresso.";


      continuar.disabled =
        false;


      continuar.textContent =
        "CONTINUAR PARA PAGAMENTO";
    }

  }
);

</script>

</body>

</html>
