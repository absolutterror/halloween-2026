<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Halloween 2026</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #020202;
            color: white;
            min-height: 100vh;
        }

        .page {
            min-height: 100vh;
            padding: 30px 15px 50px;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    rgba(255, 50, 0, 0.35),
                    transparent 35%
                ),
                #020202;
        }

        .container {
            max-width: 600px;
            margin: auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .skull {
            font-size: 55px;
            margin-bottom: 10px;

            filter:
                drop-shadow(0 0 8px #ff4500)
                drop-shadow(0 0 20px #ff1e00);
        }

        h1 {
            font-size: 38px;
            color: #ff4d00;
            letter-spacing: 2px;

            text-shadow:
                0 0 10px #ff4500,
                0 0 25px rgba(255, 50, 0, 0.6);

            margin-bottom: 10px;
        }

        .subtitle {
            color: #bbb;
            font-size: 15px;
        }

        .form-box {
            background:
                linear-gradient(
                    145deg,
                    #181818,
                    #080808
                );

            border: 1px solid #3a3a3a;
            border-left: 5px solid #ff4500;

            border-radius: 14px;

            padding: 25px;

            box-shadow:
                0 0 25px rgba(0, 0, 0, 0.6);
        }

        .ticket-type {
            text-align: center;

            margin-bottom: 25px;

            padding: 15px;

            background: #101010;

            border: 1px solid #333;

            border-radius: 10px;
        }

        .ticket-type strong {
            display: block;

            color: #ff5a00;

            font-size: 13px;

            letter-spacing: 2px;

            margin-bottom: 7px;
        }

        .ticket-type span {
            font-size: 24px;
            font-weight: bold;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            color: #ddd;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 14px;

            background: #090909;

            border: 1px solid #444;

            border-radius: 8px;

            color: white;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            border-color: #ff4500;

            box-shadow:
                0 0 10px rgba(255, 70, 0, 0.25);
        }

        .submit-button {
            width: 100%;

            padding: 16px;

            margin-top: 5px;

            background:
                linear-gradient(
                    135deg,
                    #ff4d00,
                    #c51f00
                );

            border: none;

            border-radius: 10px;

            color: white;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 0 20px rgba(255, 60, 0, 0.35);

            transition: 0.25s;
        }

        .submit-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 0 30px rgba(255, 60, 0, 0.55);
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #888;

            text-decoration: none;

            font-size: 14px;
        }

        .back:hover {
            color: #ff5a00;
        }

        @media (max-width: 600px) {

            .form-box {
                padding: 20px;
            }

            h1 {
                font-size: 30px;
            }

        }

    </style>

</head>


<body>

<div class="page">

    <div class="container">


        <div class="header">

            <div class="skull">
                💀
            </div>

            <h1>
                CADASTRO
            </h1>

            <p class="subtitle">
                Halloween 2026
            </p>

        </div>


        <div class="form-box">


            <div class="ticket-type">

                <strong>
                    INGRESSO SELECIONADO
                </strong>

                <span id="ticketType">
                    Carregando...
                </span>

            </div>


            <form>


                <div class="field">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        required
                    >

                </div>


                <div class="field">

                    <label for="whatsapp">
                        WhatsApp
                    </label>

                    <input
                        type="tel"
                        id="whatsapp"
                        name="whatsapp"
                        placeholder="(11) 99999-9999"
                        required
                    >

                </div>


                <div class="field">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="seuemail@email.com"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="submit-button"
                >
                    CONTINUAR
                </button>


            </form>


            <a
                href="index.html"
                class="back"
            >
                ← Voltar para o convite
            </a>


        </div>

    </div>

</div>


<script>

    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxnorf494VKxZJPZqY9xBgYaB1mRj3peRKJTT5EqtV5HwNi130gZftkEhXV32EF0VTc/exec";


    const params = new URLSearchParams(
        window.location.search
    );

    const tipo = params.get("tipo");

    const ticketType =
        document.getElementById("ticketType");


    let valor = "";


    if (tipo === "masculino") {

        ticketType.textContent =
            "👨 Masculino — R$ 30";

        valor = "30";

    }

    else if (tipo === "feminino") {

        ticketType.textContent =
            "👩 Feminino — R$ 20";

        valor = "20";

    }

    else {

        ticketType.textContent =
            "Ingresso não selecionado";

    }


    const formulario =
        document.querySelector("form");


    formulario.addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const nome =
                document.getElementById("nome").value;

            const whatsapp =
                document.getElementById("whatsapp").value;

            const email =
                document.getElementById("email").value;


            const botao =
                document.querySelector(".submit-button");


            botao.disabled = true;

            botao.textContent =
                "ENVIANDO...";


            try {

                await fetch(
                    URL_SCRIPT,
                    {
                        method: "POST",

                        mode: "no-cors",

                        headers: {
                            "Content-Type":
                                "text/plain;charset=utf-8"
                        },

                        body: JSON.stringify({

                            nome: nome,

                            whatsapp: whatsapp,

                            email: email,

                            tipo: tipo,

                            valor: valor

                        })

                    }
                );


                alert(
                    "Cadastro enviado com sucesso!"
                );


                formulario.reset();


                botao.disabled = false;

                botao.textContent =
                    "CONTINUAR";


            } catch (erro) {

                alert(
                    "Não foi possível enviar o cadastro. Tente novamente."
                );


                botao.disabled = false;

                botao.textContent =
                    "CONTINUAR";

            }

        }
    );

</script>

        ticketType.textContent =
            "Ingresso não selecionado";

    }

</script>


</body>

</html>
