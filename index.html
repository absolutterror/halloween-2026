<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halloween 2026</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #090909;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
            background: radial-gradient(circle at top, #3b1600 0%, #160900 35%, #090909 70%);
        }
        .card {
            width: 100%;
            max-width: 800px;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid #5a2600;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 90, 0, 0.15);
        }
        .card img {
            width: 100%;
            border-radius: 15px;
            box-shadow: 0 0 25px rgba(255,114,0,0.6);
            margin-bottom: 20px;
        }
        .prices {
            margin: 30px 0;
        }
        .prices h2 {
            margin-bottom: 18px;
            color: #fff;
        }
        .price {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #151515;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 10px;
        }
        .price-name { font-size: 18px; }
        .price-value {
            color: #ff7200;
            font-size: 22px;
            font-weight: bold;
        }
        .button {
            display: inline-block;
            width: 100%;
            border: none;
            border-radius: 12px;
            background: #ff7200;
            color: #111;
            padding: 17px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            transition: 0.2s;
        }
        .button:hover {
            background: #ff8c2a;
            transform: translateY(-2px);
        }
        .notice {
            margin-top: 25px;
            color: #999;
            font-size: 13px;
            line-height: 1.5;
        }
        .footer {
            margin-top: 30px;
            color: #555;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <!-- Fachada nova substitui o cartão antigo -->
            <img src="ChatGPT Imagem 16 de set. de 2026, 18_10_31.png" alt="Fachada Halloween 2026">

            <div class="prices">
                <h2>VALORES DA ENTRADA</h2>
                <div class="price">
                    <span class="price-name">Homens</span>
                    <span class="price-value">R$ 30</span>
                </div>
                <div class="price">
                    <span class="price-name">Mulheres</span>
                    <span class="price-value">R$ 20</span>
                </div>
            </div>

            <a href="#" class="button">CONFIRMAR PRESENÇA</a>

            <p class="notice">
                O ingresso será nominal e individual.<br>
                Após a confirmação do pagamento, será enviado<br>
                um ingresso único com QR Code para entrada.
            </p>

            <div class="footer">
                Halloween 2026 • Evento particular
            </div>
        </div>
    </div>
</body>
</html>
